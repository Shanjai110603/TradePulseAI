services:
  # 1. FastAPI Backend & Telegram Poller
  - type: web
    name: tradepulse-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./tradepulse.db
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_TEST_MODE
        value: "false"
      - key: QUOTEX_SESSION_TOKEN
        sync: false
      - key: RELAY_API_KEY
        sync: false
        # NOTE: Render's free web-service tier cannot run the Playwright
        # browser relay reliably (sleeps on idle, tight RAM). Run
        # quotex_browser_relay.py separately (e.g. on the Oracle/AWS VM)
        # and point its RELAY_TARGET_URL at this service's public URL.
      - key: MARKET_DATA_PROVIDER
        value: quotex
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-4o-mini
      - key: UPLOAD_DIR
        value: uploads/patterns

  # 2. React + Tailwind Frontend Dashboard
  - type: web
    name: tradepulse-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://tradepulse-ai-cb07.onrender.com/api/v1
