name: Quotex 24/7 Live Market Relay

on:
  schedule:
    # Runs every 5 minutes automatically in GitHub Cloud
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger at any time

jobs:
  relay_market_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & Playwright Browser
        run: |
          pip install httpx websockets playwright
          playwright install chromium --with-deps

      - name: Run Live Quotex Continuous Relay
        run: |
          python -u cloud_relay/quotex_cloud_relay.py
        env:
          BACKEND_INGEST_URL: "http://13.48.58.176:8000/api/v1/markets/candles/ingest"
          QUOTEX_SESSION_TOKEN: ${{ secrets.QUOTEX_SESSION_TOKEN }}
          QUOTEX_EMAIL: ${{ secrets.QUOTEX_EMAIL }}
          QUOTEX_PASSWORD: ${{ secrets.QUOTEX_PASSWORD }}
