version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradepulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradepulse_user
      POSTGRES_PASSWORD: tradepulse_password
      POSTGRES_DB: tradepulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradepulse_user -d tradepulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradepulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tradepulse_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://tradepulse_user:tradepulse_password@postgres:5432/tradepulse_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: tradepulse_super_secret_jwt_key_change_in_production_2026_x89
      MARKET_DATA_PROVIDER: mock
      AI_PROVIDER: mock
      TELEGRAM_TEST_MODE: "true"
      TELEGRAM_BOT_TOKEN: ""
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tradepulse_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1

volumes:
  postgres_data:
  redis_data:
