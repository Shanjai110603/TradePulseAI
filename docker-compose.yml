version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradepulse_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradepulse_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-tradepulse_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradepulse} -d ${POSTGRES_DB:-tradepulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradepulse_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tradepulse_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tradepulse}:${POSTGRES_PASSWORD:-tradepulse_secure_password_2026}@postgres:5432/${POSTGRES_DB:-tradepulse_db}
      REDIS_URL: redis://redis:6379/0
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-quotex}
      QUOTEX_EMAIL: ${QUOTEX_EMAIL:-logeshpythonbot@gmail.com}
      QUOTEX_PASSWORD: ${QUOTEX_PASSWORD:-BotForTraining@101}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8862910637:AAHNwgv4MLBysPRscJ-V30HfC-QI74FgIjU}
      TELEGRAM_TEST_MODE: "false"
    expose:
      - "8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tradepulse_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:

